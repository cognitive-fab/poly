# demo replay in a container with no route to the real Stripe or to anything else (DB6 item 3).
#
#   BUILD_DIR=/path/to/the/kept/tree START="npm start" \
#     docker compose -f demo/container/docker-compose.yml run --rm replay
#
# network_mode none: the container has a loopback and nothing else, so no bug in the build can reach an outside host. The two names
# are mapped to that loopback by extra_hosts, and the stand-in answers there on port 443 with a certificate from an authority made
# for the run (NODE_EXTRA_CA_CERTS is set by the driver). The tree under test is mounted read-only.
services:
  replay:
    build:
      context: ../..
      dockerfile: demo/container/Dockerfile
    network_mode: none
    extra_hosts:
      - "api.stripe.com:127.0.0.1"
      - "graph.facebook.com:127.0.0.1"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${BUILD_DIR:?set BUILD_DIR to the kept tree}:/build:ro
    command: ["replay", "--build", "/build", "--start", "${START:?set START to the command its README gives}", "--fault", "${FAULT:-lost-answer}"]
