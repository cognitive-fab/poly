<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>poly and GenAI red teaming: where an attack meets the gate</title>
  <desc>Attacker input reaches the agent, the agent proposes an effect, the gate allows, denies or escalates it, and only an allowed effect reaches the tool. The journal records every decision beside the gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>

  <!-- attacker input -->
  <rect x="20" y="70" width="140" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="90" y="98" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Attacker input</text>
  <text x="90" y="118" text-anchor="middle" fill="#7f1d1d" font-size="12">message, page, tool output</text>

  <!-- agent -->
  <rect x="210" y="70" width="140" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="280" y="98" text-anchor="middle" fill="#0f172a" font-weight="bold">Agent proposes</text>
  <text x="280" y="118" text-anchor="middle" fill="#334155" font-size="12">an action or an effect</text>

  <!-- gate -->
  <rect x="400" y="54" width="180" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="82" text-anchor="middle" fill="#1e3a8a" font-weight="bold">Gate</text>
  <text x="490" y="102" text-anchor="middle" fill="#1e3a8a" font-size="12">signed policy, grants,</text>
  <text x="490" y="118" text-anchor="middle" fill="#1e3a8a" font-size="12">mandates, budgets</text>
  <text x="490" y="138" text-anchor="middle" fill="#1e3a8a" font-size="12">allow / deny / escalate</text>

  <!-- tool -->
  <rect x="640" y="70" width="140" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="98" text-anchor="middle" fill="#14532d" font-weight="bold">Tool</text>
  <text x="710" y="118" text-anchor="middle" fill="#14532d" font-size="12">the effect, if allowed</text>

  <!-- person -->
  <rect x="640" y="190" width="140" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="710" y="214" text-anchor="middle" fill="#78350f" font-weight="bold">Person</text>
  <text x="710" y="232" text-anchor="middle" fill="#78350f" font-size="12">signs or refuses</text>

  <!-- journal -->
  <rect x="400" y="190" width="180" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="490" y="214" text-anchor="middle" fill="#4c1d95" font-weight="bold">Journal</text>
  <text x="490" y="232" text-anchor="middle" fill="#4c1d95" font-size="12">every decision, signed</text>

  <!-- arrows -->
  <line x1="160" y1="102" x2="206" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="102" x2="396" y2="102" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="102" x2="636" y2="102" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="94" text-anchor="middle" fill="#15803d" font-size="12">allow</text>
  <line x1="490" y1="150" x2="490" y2="186" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="498" y="172" fill="#6d28d9" font-size="12">records</text>
  <path d="M 580 140 L 640 200" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="626" y="160" fill="#b45309" font-size="12">escalate</text>
  <text x="490" y="40" text-anchor="middle" fill="#b91c1c" font-size="12">deny: the effect never runs</text>

  <text x="20" y="284" fill="#475569" font-size="12">poly does not decide whether the input is an attack. It decides whether each proposed effect may run.</text>
</svg>
