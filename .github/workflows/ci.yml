name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The evidence scripts are acceptance tests (CLAUDE.md); without Python
      # their half of test/evidence.test.mjs is reported as not run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # The import boundary runs on its own first, so a violation is the
      # first failure a reader sees.
      - run: npm run build && npm run check:boundaries
      - run: npm test
